<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERDRIVE</title>
<style>
:root{--bg:#15112e;--panel:#211a45;--line:#3b3170;--text:#f1edff;--dim:#a79fd6;--hot:#ff5d8f;--amber:#ffb02e;--cyan:#4de1ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",sans-serif}
.screen{display:none;min-height:100%;padding:32px 20px;max-width:900px;margin:0 auto}
.screen.on{display:block}
#home.on{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-height:100vh}
h1{font-size:clamp(56px,14vw,128px);line-height:.9;margin:0 0 8px;letter-spacing:-.03em;font-style:italic;font-weight:900;
 background:linear-gradient(90deg,var(--amber),var(--hot) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;transform:skewX(-8deg)}
.tag{color:var(--dim);margin:0 0 36px;max-width:42ch;line-height:1.5}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,100%)}
button{font:inherit;cursor:pointer;color:var(--text);background:var(--panel);border:2px solid var(--line);padding:14px 18px;border-radius:4px;text-align:left;font-weight:700;font-size:18px}
button:hover,button:focus-visible{border-color:var(--cyan);outline:none}
button.main{background:var(--hot);border-color:var(--hot);color:#1a0b14;font-size:22px}
button.main:hover{border-color:var(--amber)}
button small{display:block;font-weight:400;font-size:13px;color:inherit;opacity:.75}
h2{margin:0 0 6px;font-size:32px}
.back{margin-bottom:20px;padding:8px 14px;font-size:15px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{padding:8px 16px;font-size:15px}
.tabs button.act{border-color:var(--amber);color:var(--amber)}
.card{background:var(--panel);border-left:4px solid var(--cyan);padding:12px 16px;margin-bottom:10px;border-radius:0 4px 4px 0}
.card b{display:block;margin-bottom:4px}
.card p{margin:0;color:var(--dim);line-height:1.45;font-size:15px}
.card.soon{border-left-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.w{border-left-color:var(--line);cursor:pointer;border:2px solid var(--line);border-radius:4px}
.w.sel{border-color:var(--amber);background:#2d2358}
.w.lock{opacity:.45;cursor:not-allowed}
.slots{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.slot{border:2px dashed var(--line);padding:10px 14px;min-width:150px;border-radius:4px}
.slot.f{border-style:solid;border-color:var(--amber)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{font-size:15px;padding:10px 16px}
#gamewrap{padding:0;max-width:none;position:relative;background:#0e0a21}
canvas{display:block;margin:0 auto;max-width:100%;background:#0e0a21;border:2px solid var(--line)}
#over{position:absolute;inset:0;display:none;background:rgba(14,10,33,.85);flex-direction:column;align-items:center;justify-content:center;gap:12px}
#over.on{display:flex}
#over .menu{align-items:stretch}

body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 20% 30%,rgba(255,93,143,.2),transparent),radial-gradient(500px 500px at 80% 70%,rgba(77,225,255,.16),transparent),radial-gradient(400px 300px at 60% 15%,rgba(255,176,46,.12),transparent);animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(50px,-30px) scale(1.2)}}
h1{background-size:200% 100%;animation:shine 5s ease-in-out infinite alternate;filter:drop-shadow(0 0 24px rgba(255,93,143,.45))}
@keyframes shine{to{background-position:100% 0}}
button{transition:transform .12s,box-shadow .12s,border-color .12s}
button:hover,button:focus-visible{transform:translateX(6px);box-shadow:0 0 18px rgba(77,225,255,.45)}
button.main:hover{box-shadow:0 0 26px rgba(255,93,143,.7)}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <h1>OVERDRIVE</h1>
  <p class="tag">Your movement is your power. Keep moving, chain your weapons, and survive the endless waves.</p>
  <div class="menu">
    <button class="main" id="bPlay">Play Endless Mode<small>Survive as long as you can</small></button>
    <button id="bLoad">Loadout<small id="loadSum">Choose your weapons</small></button>
    <button id="bTut">Tutorial<small>Weapons, combos and controls</small></button>
  </div>
</section>

<!-- TUTORIAL -->
<section id="tut" class="screen">
  <button class="back" data-home>Back</button>
  <h2>Tutorial</h2>
  <div class="tabs">
    <button data-tab="ctl" class="act">Controls</button>
    <button data-tab="wep">Weapons</button>
    <button data-tab="cmb">Combos</button>
  </div>
  <div id="tutBody"></div>
</section>

<!-- LOADOUT -->
<section id="load" class="screen">
  <button class="back" data-home>Back</button>
  <h2>Loadout</h2>
  <p class="tag" style="margin-bottom:8px">Pick up to 3 weapons. Click a weapon to add or remove it.</p>
  <div class="slots" id="slots"></div>
  <div class="row"><button id="bRand">Randomize</button><button id="bClear">Clear</button><button id="bPlay2" class="main">Play Endless Mode</button></div>
  <h2 style="margin-top:24px;font-size:22px">Arsenal</h2>
  <div class="grid" id="arsenal"></div>
  <h2 style="margin-top:24px;font-size:22px">Combo loadouts</h2>
  <div class="grid" id="combos"></div>
</section>

<!-- GAME -->
<section id="game" class="screen" style="padding:0;max-width:none">
  <div id="gamewrap">
    <canvas id="cv" width="960" height="600"></canvas>
    <div id="over">
      <h2 id="overT">Game over</h2>
      <p id="overS"></p>
      <div class="menu"><button class="main" id="bRetry">Play again</button><button id="bHome2">Home</button></div>
    </div>
  </div>
</section>

<script>
/* ============ DATA ============ */
// type: bolt | bounce | beam | burst | well | hammer. 'soon' = not built yet.
const WEAPONS=[
 {id:'pulse',name:'Pulse Driver',type:'bolt',cd:.14,desc:'Rapid energy pulses. Reliable and accurate.',tut:'Aim at distant enemies and fire. Perfect timing builds combo energy.'},
 {id:'ricochet',name:'Ricochet',type:'bounce',cd:.45,desc:'Pulses bounce between enemies.',tut:'Hit one enemy and the pulse jumps to the next nearest target.'},
 {id:'lance',name:'Photon Lance',type:'beam',cd:0,desc:'A sustained beam that builds intensity.',tut:'Hold the mouse button to keep the beam on target. The longer you hold, the wider, brighter and stronger it gets.'},
 {id:'nova',name:'Nova Burst',type:'burst',cd:.7,desc:'Close-range burst with strong knockback.',tut:'Use when enemies surround you. Pairs well with a dash.'},
 {id:'well',name:'Gravity Well',type:'well',cd:3,desc:'A temporary gravity field that pulls enemies together.',tut:'Place it on a crowd, then hit the cluster with another weapon.'},
 {id:'hammer',name:'Hammerwave',type:'hammer',cd:1.2,desc:'A heavy circular shockwave.',tut:'Aim where you want the impact. It launches enemies away.'},
 {id:'arc',name:'Arc Caster',type:'arc',cd:.5,desc:'Electricity between connected targets.',tut:'Lightning jumps between up to 5 nearby enemies.'},
 {id:'fracture',name:'Fracture Core',type:'fracture',cd:2.5,desc:'A temporary crystalline energy field.',tut:'Creates a ring of crystals that hurt enemies. Shoot a crystal with Pulse Driver to split the pulse into three.'},
 {id:'echo',name:'Echo Drone',type:'echo',cd:3,desc:'A temporary copy of your previous movement.',tut:'Sends a drone along your last 2 seconds of movement. It damages enemies it touches.'},
 {id:'gauntlet',name:'Impact Gauntlet',type:'gauntlet',cd:.5,desc:'Your close-range combo tool.',tut:'Punches in front of you. The faster you move, the harder it hits.'},
 {id:'rift',name:'Rift Projector',type:'rift',cd:.3,desc:'Temporary linked portals.',tut:'Click twice to place two portals. Walk or shoot through one to exit the other.'},
 {id:'bow',name:'Singularity Bow',type:'bow',cd:0,desc:'Charges and releases concentrated energy.',tut:'Hold to charge. Release while the ring is gold for a perfect shot with double damage.'}
,
 {id:'tether',name:'Tether Hook',type:'tether',cd:.8,desc:'Grapple to enemies, chips or glowing anchors.',tut:'Aim at an anchor to swing yourself toward it, or at an enemy or Prism Chip to yank it to you.'},
 {id:'shield',name:'Prism Shield',type:'shield',cd:.9,desc:'A short parry window that reflects projectiles.',tut:'Click just before a bullet reaches you. An early parry is perfect and gives Overdrive. Reflected shots fly toward your cursor and split Prism Chips.'},
 {id:'rail',name:'Rail Piercer',type:'rail',cd:0,desc:'A charged shot that pierces everything in a line.',tut:'Hold to charge and release in the gold window. Marks enemies for +50% damage and passes through Rift portals.'},
 {id:'mines',name:'Phase Mines',type:'mines',cd:.5,desc:'Sticky mines that detonate on command or on contact.',tut:'Click to place up to 6. Press Q to detonate them all. Hammerwave and Arc Caster also set them off.'},
 {id:'discs',name:'Orbital Discs',type:'discs',cd:.35,desc:'Discs circle you and cut enemies, then you throw them.',tut:'Click to summon 3 discs. Click again to throw them. The faster you move, the harder they hit.'},
 {id:'blade',name:'Slipstream Blade',type:'blade',cd:1.2,desc:'A dash-slash that leaves a damaging trail.',tut:'Click to dash toward your cursor. The trail keeps hurting enemies. Echo Drone repeats it and Arc Caster links it.'},
 {id:'overclock',name:'Overclock Cannon',type:'overclock',cd:2.5,desc:'Spends your Overdrive meter for one huge shot.',tut:'Needs 40% Overdrive. The higher your meter, the more damage it does, and it drains most of the meter.'},
 {id:'scatter',name:'Scatter Flux',type:'scatter',cd:.55,desc:'A close-range shotgun of fragments.',tut:'Fires 7 fragments in a spread. Great on crowds, and it splits Prism Chips.'}
];
const COMBOS=[
 ['A: Chip Storm','Prism Chip + Pulse Driver','Find a floating chip, shoot it to split the pulse, and let the fragments hit nearby targets.'],
 ['B: Gravity Sling','Gravity Well + Hammerwave','Deploy the well, wait for enemies to cluster, then fire Hammerwave and use the blast to launch yourself.'],
 ['C: Echo Frenzy','Echo Drone + Rift Projector','Run a clean arc, deploy the echo, place a portal on its path, and sync your next ability.'],
 ['D: Fracture Cascade','Fracture Core + Arc Caster + Photon Lance','Make fragments, connect them with Arc Caster, then hold Photon Lance through the chain.'],
 ['E: Slingshot Sniper','Tether Hook + Rift Projector + Rail Piercer','Swing through an aerial portal and fire a piercing shot from a new angle.'],
 ['F: Mine Field','Phase Mines + Gravity Well + Hammerwave','Ring the well with mines, pull enemies over them, then detonate everything at once.'],
 ['G: Perfect Reflect','Prism Shield + Pulse Driver + Prism Chip','Parry a shot, aim it at a chip, and finish the fragments with Pulse Driver.'],
 ['H: Blade Echo','Slipstream Blade + Echo Drone + Arc Caster','Dash to leave a trail, repeat it with the echo, then connect both trails with arcs.'],
 ['I: Singularity Finisher','Fracture Core + Gravity Well + Singularity Bow','Gather fragments into a cluster and release a perfect charged shot.']
];
const CONTROLS=[
 ['Move','W A S D or arrow keys. Moving fast fills the Overdrive meter.'],
 ['Aim and fire','Mouse to aim, hold left click to fire.'],
 ['Dash','Space or Shift. Dashing boosts your speed instantly.'],
 ['Switch weapon','Keys 1, 2, 3 select your loadout slots.'],
 ['Overdrive','Higher Overdrive means more damage and a bigger score multiplier. Standing still drains it.'],
 ['Chains and ranks','Defeat enemies quickly to build a chain. Using different weapons raises your rank from D up to S, which boosts your score multiplier.'],
 ['Bosses','Every 5th wave a boss arrives. It flashes before each attack, so watch for the warning and keep moving.'],
 ['Special keys','Press Q to detonate all Phase Mines. In Loadout, click a combo to equip the weapons it needs.'],
 ['Sound','Press M to mute or unmute.'],
 ['Leave','Esc returns to the home screen.']
];

/* ============ STATE + MENUS ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let loadout=['pulse','hammer','well'];
try{const s=JSON.parse(localStorage.getItem('od_loadout')||'null');if(Array.isArray(s)&&s.length)loadout=s.filter(i=>WEAPONS.find(w=>w.id===i&&!w.soon)).slice(0,3)}catch(e){}
const byId=id=>WEAPONS.find(w=>w.id===id);
function save(){try{localStorage.setItem('od_loadout',JSON.stringify(loadout))}catch(e){}}
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);if(id!=='game'){running=false;['lance','bow'].forEach(n=>hum(n,false,100,0,'sine'))}}
function sum(){$('#loadSum').textContent=loadout.length?loadout.map(i=>byId(i).name).join(', '):'No weapons chosen'}

function drawTut(tab){
 $$('.tabs button').forEach(b=>b.classList.toggle('act',b.dataset.tab===tab));
 let h='';
 if(tab==='ctl')CONTROLS.forEach(c=>h+=`<div class="card"><b>${c[0]}</b><p>${c[1]}</p></div>`);
 if(tab==='wep')WEAPONS.forEach(w=>h+=`<div class="card ${w.soon?'soon':''}"><b>${w.name}${w.soon?' (Soon)':''}</b><p>${w.desc} ${w.tut}</p></div>`);
 if(tab==='cmb')COMBOS.forEach(c=>h+=`<div class="card"><b>Combo ${c[0]}</b><p><i>${c[1]}</i><br>${c[2]}</p></div>`);
 $('#tutBody').innerHTML=h;
}
function drawLoad(){drawCombos();
 let s='';
 for(let i=0;i<3;i++){const w=loadout[i]?byId(loadout[i]):null;s+=`<div class="slot ${w?'f':''}"><small>Slot ${i+1}</small><br><b>${w?w.name:'Empty'}</b></div>`}
 $('#slots').innerHTML=s;
 $('#arsenal').innerHTML=WEAPONS.map(w=>`<div class="card w ${loadout.includes(w.id)?'sel':''} ${w.soon?'lock':''}" data-w="${w.id}"><b>${w.name}${w.soon?' (Soon)':''}</b><p>${w.desc}</p></div>`).join('');
 sum();
}
$('#arsenal').onclick=e=>{
 const c=e.target.closest('[data-w]');if(!c)return;const w=byId(c.dataset.w);if(w.soon)return;
 const i=loadout.indexOf(w.id);
 if(i>=0)loadout.splice(i,1);else if(loadout.length<3)loadout.push(w.id);
 save();drawLoad();
};
$('#bRand').onclick=()=>{const p=WEAPONS.filter(w=>!w.soon).map(w=>w.id).sort(()=>Math.random()-.5);loadout=p.slice(0,3);save();drawLoad()};
$('#bClear').onclick=()=>{loadout=[];save();drawLoad()};
$('#bTut').onclick=()=>{drawTut('ctl');show('tut')};
$('#bLoad').onclick=()=>{drawLoad();show('load')};
$$('[data-home]').forEach(b=>b.onclick=()=>{sum();show('home')});
$$('[data-tab]').forEach(b=>b.onclick=()=>drawTut(b.dataset.tab));
$('#bPlay').onclick=$('#bPlay2').onclick=$('#bRetry').onclick=startGame;
$('#bHome2').onclick=()=>{sum();show('home')};
sum();

/* ============ SOUND ============ */
let AC=null,muted=false;const loops={};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,d,type,v,delay){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v,f,delay){const a=ac();if(!a||muted)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+(delay||0);s.buffer=b;fl.type='lowpass';fl.frequency.value=f||1200;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t)}
function hum(n,on,f,v,type){let l=loops[n];if(!l&&!on)return;const a=ac();if(!a)return;if(!l){const o=a.createOscillator(),g=a.createGain();o.type=type;g.gain.value=0;o.connect(g);g.connect(a.destination);o.start();l=loops[n]={o,g}}l.o.frequency.setTargetAtTime(f,a.currentTime,.05);l.g.gain.setTargetAtTime(on&&!muted?v:0,a.currentTime,.05)}
const SND={
 pulse:()=>tone(900,200,.1,'square',.06),
 bounce:()=>{tone(700,300,.12,'triangle',.1);tone(1100,500,.12,'triangle',.07,.06)},
 burst:()=>{noise(.25,.25,900);tone(160,40,.25,'sine',.25)},
 well:()=>{tone(120,600,.5,'sine',.15);tone(60,300,.5,'triangle',.1)},
 hammer:()=>{noise(.4,.35,500);tone(90,25,.4,'sawtooth',.25)},
 arc:()=>{noise(.18,.2,5000);tone(1400,200,.15,'sawtooth',.08)},
 fracture:()=>{[1200,1600,2000].forEach((f,i)=>tone(f,f*.7,.3,'triangle',.07,i*.04))},
 echo:()=>{tone(500,500,.1,'sine',.1);tone(500,500,.1,'sine',.06,.12);tone(500,500,.1,'sine',.03,.24)},
 gauntlet:()=>{noise(.15,.3,700);tone(220,60,.18,'square',.15)},
 rift:()=>{tone(300,900,.25,'sine',.12);tone(900,300,.25,'sine',.08,.1)},
 bowgo:()=>{noise(.4,.3,3000);tone(1200,50,.5,'sawtooth',.2);tone(60,30,.6,'sine',.3)},
 perfect:()=>{[880,1320,1760].forEach((f,i)=>tone(f,f,.4,'sine',.12,i*.06))},
 dash:()=>{noise(.15,.15,2500);tone(300,900,.12,'sine',.06)},
 hurt:()=>{noise(.2,.3,600);tone(150,60,.2,'sawtooth',.15)},
 kill:()=>tone(500+Math.random()*200,120,.15,'square',.05),
 warn:()=>{tone(220,220,.15,'sawtooth',.12);tone(220,220,.15,'sawtooth',.12,.2)},
 bossatk:()=>{noise(.3,.25,1500);tone(200,60,.3,'sawtooth',.18)},
 bossdie:()=>{noise(1,.4,800);[400,300,200,100].forEach((f,i)=>tone(f,f/2,.5,'sawtooth',.15,i*.15))},
 go:()=>{[400,300,200].forEach((f,i)=>tone(f,f*.6,.4,'triangle',.15,i*.2))},
 start:()=>{[300,450,600].forEach((f,i)=>tone(f,f*1.5,.2,'square',.07,i*.08))}
};
function snd(n){try{SND[n]&&SND[n]()}catch(e){}}

/* ============ EFFECTS + BOSSES ============ */
function spark(x,y,c,n,sp){n=n||3;sp=sp||150;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.3+Math.random()*.3,c,s:2+Math.random()*2})}}
function ebShot(x,y,a,sp){ebul.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:7})}
function bossAtk(e){
 snd('bossatk');shake=7;e.cd=e.p2?1.1:2;
 const toP=Math.atan2(P.y-e.y,P.x-e.x);
 if(e.pat===0){const n=e.p2?22:14;for(let i=0;i<n;i++)ebShot(e.x,e.y,i*6.283/n+e.n,190)}
 else if(e.pat===1){const ta=Math.atan2(P.y+P.vy*.6-e.y,P.x+P.vx*.6-e.x),n=e.p2?7:5;for(let i=0;i<n;i++)ebShot(e.x,e.y,ta+(i-(n-1)/2)*.2,300)}
 else if(e.pat===2){e.dash=.55;e.dvx=Math.cos(toP)*520;e.dvy=Math.sin(toP)*520;e.cd=e.p2?1:1.6}
 else e.spiral=e.p2?2.2:1.6;
}
function drawBoss(e){
 const t=performance.now()/1000,tel=e.tele>0,fl=(tel&&Math.floor(t*14)%2)||e.flash>0,col=fl?'#fff':(e.p2?'#ff3b3b':'#ff5d8f');
 if(tel){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(255,93,143,.55)';ctx.lineWidth=3;ctx.setLineDash([10,8]);
  if(e.pat===2){ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(P.x,P.y);ctx.stroke()}
  if(e.pat===1){const tx=P.x+P.vx*.6,ty=P.y+P.vy*.6;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.beginPath();ctx.arc(tx,ty,16,0,6.28);ctx.stroke()}
  if(e.pat===0||e.pat===3){ctx.setLineDash([]);ctx.beginPath();ctx.arc(e.x,e.y,e.r+14+(1-e.tele/.8)*60,0,6.28);ctx.stroke()}
  ctx.restore()}
 ctx.save();ctx.globalCompositeOperation='lighter';glow(e.x,e.y,e.r*3.4,col,.45+(tel?.3:0));
 for(let i=0;i<6;i++){const a=t*1.8+i*1.047,r=e.r+22+Math.sin(t*3+i)*5;ctx.fillStyle='#ffb02e';ctx.save();ctx.translate(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r);ctx.rotate(a);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(0,5);ctx.lineTo(-8,0);ctx.lineTo(0,-5);ctx.fill();ctx.restore()}
 ctx.restore();
 ctx.save();ctx.translate(e.x,e.y);ctx.rotate(t*.6);
 ctx.fillStyle=col;hexPath(e.r);ctx.fill();ctx.fillStyle='#15112e';hexPath(e.r*.7);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;hexPath(e.r*.45);ctx.stroke();
 ctx.rotate(-t*2.2);ctx.strokeStyle='#ffb02e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,e.r+9,0,4.2);ctx.stroke();ctx.restore();
 const a=Math.atan2(P.y-e.y,P.x-e.x),pr=1+Math.sin(t*5)*.15;
 ctx.fillStyle=fl?'#fff':'#4de1ff';ctx.beginPath();ctx.arc(e.x+Math.cos(a)*6,e.y+Math.sin(a)*6,10*pr,0,6.28);ctx.fill();
 ctx.fillStyle='#05030f';ctx.beginPath();ctx.arc(e.x+Math.cos(a)*9,e.y+Math.sin(a)*9,4,0,6.28);ctx.fill();
}
function drawLance(){
 const a=beam,L=520,k=lanceT,t=performance.now()/1000,w=6+k*14,ex=P.x+Math.cos(a)*L,ey=P.y+Math.sin(a)*L,nx=-Math.sin(a),ny=Math.cos(a);
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';

let combo=0,comboT=0,rank=0,recent=[],pops=[],flash=0,ts=1,trail=[],cracks=[],slashes=[],chips=[],chipT=1,mines=[],discs=[],slip=[],slipOn=0,rails=[],tethers=[];
const stars=Array.from({length:80},()=>({x:Math.random()*960,y:Math.random()*600,z:Math.random()}));
SND.rank=()=>{[600,800,1000,1300].forEach((f,i)=>tone(f,f*1.1,.15,'square',.07,i*.06))};
SND.kill=()=>{tone(380+Math.min(combo,30)*30,100,.15,'square',.05);noise(.12,.12,2500)};
function resetFx(){chips=[];chipT=1;mines=[];discs=[];slip=[];slipOn=0;rails=[];tethers=[];combo=0;comboT=0;rank=0;recent=[];pops=[];flash=0;ts=1;trail=[];cracks=[];slashes=[]}
function noteUse(id){const n=performance.now(),r=recent.find(q=>q.id===id);if(r)r.t=n;else recent.push({id,t:n})}
function pop(x,y,txt,c,big){pops.push({x,y,txt,c,big,t:.9,vy:-45})}
function onKill(e){
 combo++;comboT=3;const pts=Math.round((e.boss?500:10)*mult());
 pop(e.x,e.y,'+'+pts,e.boss?'#ffb02e':'#f1edff',e.boss);
 spark(e.x,e.y,e.boss?'#ffb02e':'#ff5d8f',e.boss?80:16,e.boss?380:220);
 fx.push({x:e.x,y:e.y,r:4,max:e.boss?260:55,t:.35,c:'#ff5d8f',ring:1});
 if(e.boss){flash=.9;ts=.15;for(let i=1;i<5;i++)fx.push({x:e.x,y:e.y,r:4,max:90*i+60,t:.5+i*.12,c:i%2?'#ffb02e':'#4de1ff',ring:1})}
 if(combo%10===0){snd('rank');pop(P.x,P.y-40,'Chain x'+combo,'#4de1ff',1)}
}
function muzzle(w,a){
 const x=P.x+Math.cos(a)*18,y=P.y+Math.sin(a)*18,col=WC[w.id]||'#fff',ring=(m,c,t)=>fx.push({x:P.x,y:P.y,r:4,max:m,t:t||.3,c,ring:1});
 if(w.id==='pulse')spark(x,y,col,4,220);
 if(w.id==='ricochet')spark(x,y,col,6,260);
 if(w.id==='nova'){ring(150,col);ring(100,'#fff',.2);spark(P.x,P.y,col,36,330)}
 if(w.id==='hammer'){const mx=mouse.x,my=mouse.y;fx.push({x:mx,y:my,r:4,max:230,t:.45,c:'#ffb02e',ring:1});fx.push({x:mx,y:my,r:4,max:120,t:.3,c:'#fff',ring:1});cracks.push({x:mx,y:my,t:.7,as:Array.from({length:9},()=>Math.random()*6.28)});spark(mx,my,'#ff7a3d',40,360)}
 if(w.id==='well')fx.push({x:mouse.x,y:mouse.y,r:4,max:60,t:.3,c:'#a77bff',ring:1});
 if(w.id==='arc')spark(x,y,'#9fe8ff',8,260);
 if(w.id==='fracture')spark(mouse.x,mouse.y,'#d77bff',26,240);
 if(w.id==='echo')ring(70,col);
 if(w.id==='gauntlet'){slashes.push({x:P.x,y:P.y,a,t:.22});spark(P.x+Math.cos(a)*55,P.y+Math.sin(a)*55,'#ffd166',16,300)}
 if(w.id==='rift')spark(mouse.x,mouse.y,col,14,200);
}
function fxUpdate(dt){weaponsUpdate(dt);
 comboT-=dt;if(comboT<=0)combo=0;
 const now=performance.now();recent=recent.filter(r=>now-r.t<4000);
 const pts=combo+recent.length*4,nr=combo<2?0:pts>=45?4:pts>=30?3:pts>=18?2:pts>=8?1:0;
 if(nr>rank&&combo>=2){snd('rank');flash=Math.max(flash,.15);pop(P.x,P.y-30,'Rank '+'DCBAS'[nr],'#ffb02e',1)}
 rank=nr;flash=Math.max(0,flash-dt*2.5);
 pops.forEach(p=>{p.t-=dt;p.y+=p.vy*dt});pops=pops.filter(p=>p.t>0);
 slashes.forEach(q=>q.t-=dt);slashes=slashes.filter(q=>q.t>0);cracks.forEach(q=>q.t-=dt);cracks=cracks.filter(q=>q.t>0);
 trail.push({x:P.x,y:P.y,t:.28,c:od>60?'#ffb02e':'#4de1ff'});trail.forEach(q=>q.t-=dt);trail=trail.filter(q=>q.t>0);
 const o=od/100;
 stars.forEach(s=>{s.y+=(25+s.z*55+od*(2+s.z*4))*dt;s.x-=P.vx*.1*s.z*dt;if(s.y>H){s.y=-10;s.x=Math.random()*W}if(s.x<0)s.x+=W;if(s.x>W)s.x-=W});
 if(o>.55&&Math.random()<o)parts.push({x:P.x+(Math.random()-.5)*10,y:P.y+(Math.random()-.5)*10,vx:-P.vx*.25+(Math.random()-.5)*60,vy:-P.vy*.25+(Math.random()-.5)*60-20,t:.35,c:Math.random()<.5?'#ffb02e':'#ff5d8f',s:2+Math.random()*3});
 wells.forEach(g=>{if(Math.random()<.8){const a=Math.random()*6.28,r=150+Math.random()*50;parts.push({x:g.x+Math.cos(a)*r,y:g.y+Math.sin(a)*r,vx:-Math.cos(a)*r*2.6,vy:-Math.sin(a)*r*2.6,t:.38,c:'#a77bff',s:2.5})}});
 portals.forEach((p,i)=>{if(Math.random()<.5){const a=Math.random()*6.28;parts.push({x:p.x+Math.cos(a)*14,y:p.y+Math.sin(a)*24,vx:Math.cos(a)*40,vy:Math.sin(a)*60,t:.4,c:i?'#ffb02e':'#4de1ff',s:2})}});
 shots.forEach(s=>{if(!s.big&&Math.random()<.8)parts.push({x:s.x,y:s.y,vx:0,vy:0,t:.18,c:s.col||(s.rico?'#ffb02e':'#4de1ff'),s:2})});
 ebul.forEach(b=>{if(Math.random()<.5)parts.push({x:b.x,y:b.y,vx:0,vy:0,t:.2,c:'#ff5d8f',s:3})});
 enemies.forEach(e=>{if(e.flash>0)e.flash-=dt;
  if(e.boss&&e.dash>0)parts.push({x:e.x,y:e.y,vx:0,vy:0,t:.3,c:'#ff5d8f',s:22});
  if(e.boss&&Math.random()<.4){const a=Math.random()*6.28;parts.push({x:e.x+Math.cos(a)*e.r,y:e.y+Math.sin(a)*e.r,vx:Math.cos(a)*30,vy:Math.sin(a)*30,t:.5,c:e.p2?'#ff3b3b':'#ff5d8f',s:3})}});
 if(beam!==null)noteUse('lance');
 if(parts.length>600)parts.splice(0,parts.length-600);
}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();ctx.globalAlpha=1}
function add(fn){ctx.save();ctx.globalCompositeOperation='lighter';fn();ctx.restore()}
function jag(x1,y1,x2,y2,d){const pts=[[x1,y1]],n=Math.max(2,Math.floor(Math.hypot(x2-x1,y2-y1)/18));for(let i=1;i<n;i++){const f=i/n;pts.push([x1+(x2-x1)*f+(Math.random()-.5)*d,y1+(y2-y1)*f+(Math.random()-.5)*d])}pts.push([x2,y2]);return pts}
function hexPath(r){ctx.beginPath();for(let i=0;i<6;i++)ctx.lineTo(Math.cos(i*1.047)*r,Math.sin(i*1.047)*r);ctx.closePath()}

function draw(){
 const t=performance.now()/1000,o=od/100;
 ctx.save();if(shake>.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 ctx.fillStyle='#0e0a21';ctx.fillRect(-30,-30,W+60,H+60);

 stars.forEach(s=>{ctx.globalAlpha=.25+s.z*.55;ctx.fillStyle=o>.5?'#ffb02e':'#a79fd6';ctx.fillRect(s.x,s.y,1.5*s.z+.5,o>.4?1.5+o*16*s.z:1.5*s.z+.5)});ctx.globalAlpha=1;
 // grid shifts from cyan to amber as Overdrive rises
 const gc='rgba('+Math.round(77+o*178)+','+Math.round(225-o*50)+','+Math.round(255-o*209)+',';
 ctx.strokeStyle=gc+(.07+o*.13+.03*Math.sin(t*3)).toFixed(3)+')';ctx.lineWidth=1;
 const gx=-(P.x*.12)%40,gy=-(P.y*.12)%40;
 for(let x=gx;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=gy;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.strokeStyle=gc+'.5)';ctx.lineWidth=3;ctx.strokeRect(2,2,W-4,H-4);
 // additive ground effects
 add(()=>{
  cracks.forEach(k=>{ctx.globalAlpha=Math.min(1,k.t*2);ctx.strokeStyle='#ffb02e';ctx.lineWidth=3;k.as.forEach(a=>{ctx.beginPath();ctx.moveTo(k.x,k.y);let x=k.x,y=k.y;const L=60+150*(1-k.t/.7);for(let d=0;d<L;d+=15){x+=Math.cos(a+(Math.random()-.5)*.5)*15;y+=Math.sin(a+(Math.random()-.5)*.5)*15;ctx.lineTo(x,y)}ctx.stroke()})});
  slashes.forEach(s=>{ctx.globalAlpha=Math.min(1,s.t*5);ctx.lineCap='round';ctx.strokeStyle='#ffd166';ctx.lineWidth=14*Math.min(1,s.t*5);ctx.beginPath();ctx.arc(s.x,s.y,62,s.a-1.1,s.a+1.1);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()});
  ctx.globalAlpha=1;
 });
 wells.forEach(g=>{
  const R=190*Math.min(1,(2.5-g.t)*5+.25),k=g.t/2.5;
  add(()=>{glow(g.x,g.y,R,'#a77bff',.4);ctx.lineWidth=2;
   for(let arm=0;arm<3;arm++){ctx.beginPath();for(let j=0;j<=26;j++){const r=R*j/26,a=t*4*(1.2-j/30)+arm*2.094+j*.28,x=g.x+Math.cos(a)*r,y=g.y+Math.sin(a)*r;j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=arm?'#d77bff':'#7aa0ff';ctx.globalAlpha=.7;ctx.stroke()}
   ctx.globalAlpha=.1+.25*k;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(g.x,g.y,R,0,6.28);ctx.stroke()});
  ctx.fillStyle='#05030f';ctx.beginPath();ctx.arc(g.x,g.y,10,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
 });
 add(()=>fx.forEach(f=>{const al=Math.max(0,Math.min(1,f.t*3));
  if(f.ring){glow(f.x,f.y,f.r*1.1,f.c,al*.18);ctx.globalAlpha=al;ctx.strokeStyle=f.c;ctx.lineWidth=2+f.r*.04;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.28);ctx.stroke()}
  else{ctx.globalAlpha=al;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+(.2-f.t)*3),0,6.28);ctx.fill()}}));
 // fracture crystals
 frags.forEach(f=>{const h=(t*120+f.x)%360;add(()=>glow(f.x,f.y,34,'hsl('+h+',90%,60%)',.5));ctx.fillStyle='hsl('+h+',90%,70%)';ctx.beginPath();ctx.moveTo(f.x,f.y-15);ctx.lineTo(f.x+10,f.y);ctx.lineTo(f.x,f.y+15);ctx.lineTo(f.x-10,f.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(f.x-1,f.y-8,2,16*(.5+.5*Math.sin(t*8+f.x)))});
 // rift portals
 if(portals.length===2){ctx.save();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(portals[0].x,portals[0].y);ctx.lineTo(portals[1].x,portals[1].y);ctx.stroke();ctx.restore()}
 portals.forEach((p,i)=>{const c=i?'#ffb02e':'#4de1ff';
  add(()=>{glow(p.x,p.y,50,c,.45);ctx.strokeStyle=c;for(let k=0;k<4;k++){ctx.lineWidth=3-k*.5;ctx.globalAlpha=1-k*.2;ctx.beginPath();ctx.ellipse(p.x,p.y,10+k*3+Math.sin(t*6+k)*2,22-k*3,t*(i?1:-1)*(1+k*.5),0,6.28);ctx.stroke()}});
  ctx.fillStyle='#05030f';ctx.beginPath();ctx.ellipse(p.x,p.y,8,18,0,0,6.28);ctx.fill()});
 // echo drones
 drones.forEach(d=>add(()=>{for(let k=1;k<=8;k++){const q=d.path[Math.max(0,d.i-k*3)];if(q){ctx.globalAlpha=.35-k*.04;ctx.fillStyle='#4de1ff';ctx.beginPath();ctx.arc(q.x,q.y,13-k,0,6.28);ctx.fill()}}
  glow(d.x,d.y,40,'#4de1ff',.5);ctx.globalAlpha=.9;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d.x,d.y,11,0,6.28);ctx.stroke();ctx.beginPath();ctx.arc(d.x,d.y,6+Math.sin(t*12)*2,0,6.28);ctx.stroke()}));
 // enemies
 enemies.forEach(e=>{if(e.boss){drawBoss(e);return}
  const a=Math.atan2(P.y-e.y,P.x-e.x),fl=e.flash>0;
  add(()=>glow(e.x,e.y,e.r*2.6,'#ff5d8f',.35));
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(a);
  ctx.fillStyle=fl?'#fff':(e.shoot?'#ff9d2e':'#ff5d8f');ctx.beginPath();ctx.moveTo(e.r+4,0);ctx.lineTo(-e.r*.8,e.r*.95);ctx.lineTo(-e.r*.4,0);ctx.lineTo(-e.r*.8,-e.r*.95);ctx.closePath();ctx.fill();
  ctx.fillStyle='#15112e';ctx.beginPath();ctx.arc(-1,0,e.r*.38,0,6.28);ctx.fill();ctx.fillStyle=fl?'#ff5d8f':'#ffb02e';ctx.beginPath();ctx.arc(2,0,e.r*.2,0,6.28);ctx.fill();ctx.restore()});
 // additive combat layer
 add(()=>{
  arcs.forEach(a=>{const f=Math.min(1,a.t*8);for(let k=1;k<a.pts.length;k++){const A=a.pts[k-1],B=a.pts[k],pp=jag(A[0],A[1],B[0],B[1],22);
   [[10,.18,'#7aa0ff'],[4,.7,'#9fe8ff'],[1.6,1,'#fff']].forEach(q=>{ctx.globalAlpha=q[1]*f;ctx.strokeStyle=q[2];ctx.lineWidth=q[0];ctx.beginPath();pp.forEach((u,i)=>i?ctx.lineTo(u[0],u[1]):ctx.moveTo(u[0],u[1]));ctx.stroke()})}
   a.pts.forEach(q=>glow(q[0],q[1],26,'#9fe8ff',.6*f))});
  ebul.forEach(b=>{const a=Math.atan2(b.vy,b.vx);glow(b.x,b.y,b.r*3.2,'#ff5d8f',.55);ctx.globalAlpha=.6;ctx.strokeStyle='#ff5d8f';ctx.lineWidth=b.r;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x-Math.cos(a)*14,b.y-Math.sin(a)*14);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r-3,0,6.28);ctx.fill()});
 });
 shots.forEach(s=>{if(s.big){drawSing(s);return}
  const a=Math.atan2(s.vy,s.vx),c=s.col||(s.rico?'#ffb02e':'#4de1ff'),L=s.split?10:18;
  add(()=>{glow(s.x,s.y,22,c,.5);ctx.lineCap='round';ctx.strokeStyle=c;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(s.x-Math.cos(a)*L,s.y-Math.sin(a)*L);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke()})});
 if(beam!==null)drawLance();
 add(()=>trail.forEach(q=>{ctx.globalAlpha=q.t*1.6;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,12*(q.t/.28),0,6.28);ctx.fill()}));
 add(()=>parts.forEach(q=>{const k=Math.min(1,q.t*3);ctx.globalAlpha=k;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s*(.4+.6*k),0,6.28);ctx.fill()}));
 drawExtra(t);
 // player
 const pc=od>60?'#ffb02e':'#4de1ff',ang=Math.atan2(mouse.y-P.y,mouse.x-P.x);
 add(()=>{glow(P.x,P.y,30+o*40,pc,.45+o*.3);ctx.strokeStyle=pc;ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.globalAlpha=.3+o*.5;ctx.beginPath();ctx.arc(P.x,P.y,17+o*14+i*3,t*(2+o*6)+i*2.1,t*(2+o*6)+i*2.1+1.2+o);ctx.stroke()}});
 ctx.globalAlpha=P.inv>0&&Math.floor(t*20)%2?.4:1;
 const cg=ctx.createRadialGradient(P.x-3,P.y-3,1,P.x,P.y,13);cg.addColorStop(0,'#fff');cg.addColorStop(1,pc);ctx.fillStyle=cg;ctx.beginPath();ctx.arc(P.x,P.y,12,0,6.28);ctx.fill();
 ctx.save();ctx.translate(P.x,P.y);ctx.rotate(ang);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(26,0);ctx.lineTo(18,-5);ctx.lineTo(18,5);ctx.fill();ctx.restore();ctx.globalAlpha=1;
 if(charge>0)drawBow();
 // crosshair
 ctx.save();ctx.strokeStyle='#f1edff';ctx.lineWidth=2;ctx.setLineDash([4,6]);ctx.lineDashOffset=-t*20;ctx.beginPath();ctx.arc(mouse.x,mouse.y,10,0,6.28);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.fillRect(mouse.x-1.5,mouse.y-1.5,3,3);ctx.restore();
 // popups
 ctx.textAlign='center';pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.t*2);ctx.font=(p.big?'bold 28px':'bold 15px')+' sans-serif';ctx.fillStyle=p.c;ctx.strokeStyle='#0e0a21';ctx.lineWidth=3;ctx.strokeText(p.txt,p.x,p.y);ctx.fillText(p.txt,p.x,p.y)});ctx.globalAlpha=1;ctx.textAlign='left';
 // vignette (turns red when health is low) and screen flash
 const low=Math.max(0,(40-P.hp)/40),vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba('+Math.round(150*low)+',0,'+Math.round(30*low)+','+(.4+low*.35).toFixed(2)+')');
 ctx.fillStyle=vg;ctx.fillRect(-30,-30,W+60,H+60);
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(1,flash).toFixed(2)+')';ctx.fillRect(-30,-30,W+60,H+60)}
 ctx.restore();
 hud();
}
function hud(){
 const o=od/100,tt=performance.now();
 ctx.fillStyle='#211a45';ctx.fillRect(16,16,240,16);ctx.fillStyle=P.hp<35&&Math.floor(tt/150)%2?'#ff3b3b':'#ff5d8f';ctx.fillRect(16,16,240*Math.max(0,P.hp)/100,16);ctx.strokeStyle='#3b3170';ctx.lineWidth=2;ctx.strokeRect(16,16,240,16);
 ctx.fillStyle='#211a45';ctx.fillRect(16,40,240,16);const g=ctx.createLinearGradient(16,0,256,0);g.addColorStop(0,'#4de1ff');g.addColorStop(.6,'#ffb02e');g.addColorStop(1,'#ff5d8f');ctx.fillStyle=g;ctx.fillRect(16,40,240*o,16);

 ctx.fillStyle='#f1edff';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillText('Health',264,29);ctx.fillText('Overdrive x'+mult().toFixed(1),264,53);

  ctx.fillStyle=act?'#2d2358':'#1a1438';ctx.fillRect(x,y,184,36);ctx.fillStyle=c;ctx.globalAlpha=act?.35:.15;ctx.fillRect(x,y,184*(1-left),36);ctx.globalAlpha=1;
  ctx.strokeStyle=act?c:'#3b3170';ctx.lineWidth=act?3:2;ctx.strokeRect(x,y,184,36);
  ctx.fillStyle=act?'#fff':'#a79fd6';ctx.font='bold 14px sans-serif';ctx.fillText((i+1)+'  '+w.name,x+10,y+23)});

/* ============ WEAPONS 13-20, PRISM CHIPS, COMBO SYNERGIES ============ */
Object.assign(WC,{tether:'#7affd4',shield:'#ffd166',rail:'#4de1ff',mines:'#ff5d8f',discs:'#ffd166',blade:'#7affd4',overclock:'#ff5d8f',scatter:'#d77bff'});
const anchors=[{x:W*.12,y:H*.22},{x:W*.88,y:H*.22},{x:W*.12,y:H*.78},{x:W*.88,y:H*.78}];
const COMBO_IDS=[['pulse','fracture'],['well','hammer'],['echo','rift'],['fracture','arc','lance'],['tether','rift','rail'],['mines','well','hammer'],['shield','pulse'],['blade','echo','arc'],['fracture','well','bow']];
function drawCombos(){$('#combos').innerHTML=COMBOS.map((c,i)=>`<div class="card w" data-c="${i}"><b>Combo ${c[0]}</b><p>${COMBO_IDS[i].map(id=>byId(id).name).join(', ')}<br>Click to equip these weapons</p></div>`).join('')}
$('#combos').onclick=e=>{const c=e.target.closest('[data-c]');if(!c)return;loadout=COMBO_IDS[c.dataset.c].slice();save();drawLoad()};
SND.tether=()=>{noise(.12,.2,3000);tone(300,900,.15,'sawtooth',.1)};
SND.shield=()=>{tone(500,520,.2,'triangle',.12);tone(1000,1040,.2,'sine',.06)};
SND.mines=()=>{tone(200,100,.1,'square',.1);tone(800,800,.05,'square',.05,.1)};
SND.discs=()=>tone(400,1200,.3,'sawtooth',.08);
SND.blade=()=>{noise(.2,.25,5000);tone(1800,400,.15,'sawtooth',.1)};
SND.overclock=()=>{noise(.6,.4,2000);tone(900,30,.7,'sawtooth',.25);tone(50,25,.8,'sine',.35)};
SND.scatter=()=>{noise(.2,.35,3000);tone(150,50,.2,'square',.15)};

function detonateAll(){mines.forEach(m=>m.go=1)}
function splitChip(c){
 if(c.dead)return;c.dead=1;
 const ts=enemies.slice().sort((a,b)=>Math.hypot(a.x-c.x,a.y-c.y)-Math.hypot(b.x-c.x,b.y-c.y)).slice(0,5);
 for(let i=0;i<5;i++){const t=ts[i],q=t?Math.atan2(t.y-c.y,t.x-c.x):i*1.2566;shots.push({x:c.x,y:c.y,vx:Math.cos(q)*720,vy:Math.sin(q)*720,bounce:0,seen:[],life:.9,split:1,chipfrag:1,col:'#d77bff',dmg:2})}
 spark(c.x,c.y,'#d77bff',24,300);fx.push({x:c.x,y:c.y,r:4,max:70,t:.3,c:'#d77bff',ring:1});
 score+=15;od=Math.min(100,od+6);pop(c.x,c.y-14,'Chip Storm','#d77bff',0);snd('fracture');
}
function detFrag(f){
 if(f.det)return;f.det=1;f.t=Math.min(f.t,.1);
 enemies.forEach(e=>{if(Math.hypot(e.x-f.x,e.y-f.y)<110)hit(e,5*mult())});
 fx.push({x:f.x,y:f.y,r:4,max:110,t:.35,c:'#ffb02e',ring:1});spark(f.x,f.y,'#ffb02e',16,300);
}
function zapFrag(f){
 if((f.z||0)>0)return;f.z=.5;
 enemies.forEach(e=>{if(Math.hypot(e.x-f.x,e.y-f.y)<90)hit(e,2*mult())});
 fx.push({x:f.x,y:f.y,r:4,max:90,t:.3,c:'#9fe8ff',ring:1});spark(f.x,f.y,'#9fe8ff',10,220);
}
function zap(x,y,r){
 frags.forEach(f=>{if(Math.hypot(f.x-x,f.y-y)<r)zapFrag(f)});
 chips.forEach(c=>{if(!c.dead&&Math.hypot(c.x-x,c.y-y)<r)splitChip(c)});
 mines.forEach(m=>{if(Math.hypot(m.x-x,m.y-y)<r+30)m.go=1});
}
function castRay(x,y,a,L,w,fn,col,life,width,depth){
 const c=Math.cos(a),s=Math.sin(a);let end=L,port=null;
 if(portals.length===2&&!depth)portals.forEach((p,i)=>{const rx=p.x-x,ry=p.y-y,t=rx*c+ry*s,pp=Math.abs(-rx*s+ry*c);if(t>20&&t<end&&pp<26){end=t;port=portals[1-i]}});
 enemies.slice().forEach(e=>{const rx=e.x-x,ry=e.y-y,t=rx*c+ry*s,pp=Math.abs(-rx*s+ry*c);if(t>0&&t<end&&pp<e.r+w/2)fn(e)});
 ebul=ebul.filter(b=>{const rx=b.x-x,ry=b.y-y,t=rx*c+ry*s,pp=Math.abs(-rx*s+ry*c);return !(t>0&&t<end&&pp<w/2+6)});
 chips.forEach(ch=>{const rx=ch.x-x,ry=ch.y-y,t=rx*c+ry*s,pp=Math.abs(-rx*s+ry*c);if(t>0&&t<end&&pp<ch.r+w/2)splitChip(ch)});
 frags.forEach(f=>{const rx=f.x-x,ry=f.y-y,t=rx*c+ry*s,pp=Math.abs(-rx*s+ry*c);if(t>0&&t<end&&pp<16+w/2)detFrag(f)});
 mines.forEach(m=>{const rx=m.x-x,ry=m.y-y,t=rx*c+ry*s,pp=Math.abs(-rx*s+ry*c);if(t>0&&t<end&&pp<w/2+14)m.go=1});
 rails.push({x1:x,y1:y,x2:x+c*end,y2:y+s*end,t:life,c:col,w:width});
 if(port){pop(port.x,port.y-26,'Slingshot','#4de1ff',1);castRay(port.x,port.y,a,L-end,w,fn,col,life,width,1)}
}
function fireRail(){
 const a=Math.atan2(mouse.y-P.y,mouse.x-P.x),full=Math.min(1,charge),perfect=charge>=1&&charge<1.2;
 castRay(P.x,P.y,a,900,16,e=>{hit(e,(3+5*full)*(perfect?1.5:1),Math.cos(a)*200,Math.sin(a)*200);e.mark=5},'#4de1ff',.35,10);
 snd('bowgo');noteUse('rail');shake=8;spark(P.x,P.y,'#4de1ff',20,300);
 if(perfect){snd('perfect');od=Math.min(100,od+10);score+=20}
}
function overclock(a){
 if(od<40){pop(P.x,P.y-30,'Needs 40% Overdrive','#ff5d8f',0);snd('hurt');return}
 const d=8+od*.2;od=Math.max(0,od-60);shake=22;flash=.35;
 castRay(P.x,P.y,a,900,44,e=>{hit(e,d,Math.cos(a)*400,Math.sin(a)*400)},'#ff5d8f',.55,44);
 spark(P.x,P.y,'#ff5d8f',50,420);fx.push({x:P.x,y:P.y,r:4,max:140,t:.4,c:'#ff5d8f',ring:1});
}
function tether(a){
 const c=Math.cos(a),s=Math.sin(a);let best=null,bt=520;
 const test=(o,r,type)=>{const rx=o.x-P.x,ry=o.y-P.y,t=rx*c+ry*s,pp=Math.abs(-rx*s+ry*c);if(t>20&&t<bt&&pp<r+14){bt=t;best={o,type}}};
 enemies.forEach(e=>test(e,e.r,'e'));chips.forEach(ch=>test(ch,ch.r,'c'));anchors.forEach(an=>test(an,14,'a'));
 if(!best){tethers.push({x1:P.x,y1:P.y,x2:P.x+c*220,y2:P.y+s*220,t:.12});return}
 const o=best.o,d=Math.hypot(P.x-o.x,P.y-o.y)||1;
 tethers.push({x1:P.x,y1:P.y,x2:o.x,y2:o.y,t:.25});spark(o.x,o.y,'#7affd4',10,200);
 if(best.type==='a'){P.vx=-(P.x-o.x)/d*760;P.vy=-(P.y-o.y)/d*760;P.dashT=.3;P.inv=.2;od=Math.min(100,od+10)}
 else{o.vx=(o.vx||0)+(P.x-o.x)/d*700;o.vy=(o.vy||0)+(P.y-o.y)/d*700;if(best.type==='e')hit(o,2*mult())}
}
function fireNew(w,a){
 const c=Math.cos(a),s=Math.sin(a);
 if(w.type==='tether')tether(a);
 if(w.type==='shield')P.shield={t:.4,a};
 if(w.type==='mines'){const d=Math.min(420,Math.hypot(mouse.x-P.x,mouse.y-P.y));mines.push({x:P.x+c*d,y:P.y+s*d,t:14,arm:.4});if(mines.length>6)mines.shift()}
 if(w.type==='discs'){if(!discs.length){for(let i=0;i<3;i++)discs.push({a:i*2.094,t:7,mode:0,x:P.x,y:P.y,vx:0,vy:0})}else discs.forEach(d=>{if(!d.mode){d.mode=1;d.vx=c*680+P.vx*.3;d.vy=s*680+P.vy*.3;d.t=1.1}})}
 if(w.type==='blade'){P.vx=c*720;P.vy=s*720;P.dashT=.3;P.inv=.35;slipOn=.3;od=Math.min(100,od+6)}
 if(w.type==='scatter'){for(let i=0;i<7;i++){const q=a+(i-3)*.1+(Math.random()-.5)*.05;shots.push({x:P.x+c*14,y:P.y+s*14,vx:Math.cos(q)*680,vy:Math.sin(q)*680,bounce:0,seen:[],life:.45,split:1,col:'#d77bff'})}P.vx-=c*120;P.vy-=s*120;shake=4}
 if(w.type==='overclock')overclock(a);
 if(w.type==='hammer'){const mx=mouse.x,my=mouse.y;
  mines.forEach(m=>{if(Math.hypot(m.x-mx,m.y-my)<170)m.go=1});
  chips.forEach(ch=>{const d=Math.hypot(ch.x-mx,ch.y-my)||1;if(d<170){ch.vx+=(ch.x-mx)/d*600;ch.vy+=(ch.y-my)/d*600}});
  const dp=Math.hypot(P.x-mx,P.y-my);
  if(dp<200){const k=dp||1;P.vx=(P.x-mx)/k*680;P.vy=(P.y-my)/k*680;P.dashT=.25;od=Math.min(100,od+10);if(wells.some(g=>Math.hypot(g.x-mx,g.y-my)<140))pop(P.x,P.y-30,'Gravity Sling','#a77bff',1)}}
 if(w.type==='burst'){
  chips.forEach(ch=>{const d=Math.hypot(ch.x-P.x,ch.y-P.y)||1;if(d<130){ch.vx+=(ch.x-P.x)/d*600;ch.vy+=(ch.y-P.y)/d*600}});
  mines.forEach(m=>{if(Math.hypot(m.x-P.x,m.y-P.y)<130)m.go=1});
  if(P.dashT>0){P.vx=-c*620;P.vy=-s*620;P.dashT=.2}}
 if(w.type==='gauntlet'){const x=P.x+c*55,y=P.y+s*55;chips.forEach(ch=>{if(Math.hypot(ch.x-x,ch.y-y)<90){ch.vx=c*650;ch.vy=s*650}})}
 if(w.type==='arc'){
  zap(mouse.x,mouse.y,90);zap(P.x+c*200,P.y+s*200,120);
  if(slip.length>2){const sp=slip.filter((q,i)=>i%4===0).map(q=>[q.x,q.y]);if(sp.length>1){arcs.push({pts:sp,t:.2});sp.forEach(q=>enemies.forEach(e=>{if(Math.hypot(e.x-q[0],e.y-q[1])<45)hit(e,3*mult())}));pop(P.x,P.y-30,'Blade Echo','#7affd4',1)}}}
}
function chipHits(){
 shots.forEach(s=>{if(s.chipfrag||s.life<=0)return;
  chips.forEach(c=>{if(!c.dead&&Math.hypot(c.x-s.x,c.y-s.y)<c.r+6){splitChip(c);if(!s.pierce)s.life=0}});
  if(s.pierce)frags.forEach(f=>{if(!f.det&&Math.hypot(f.x-s.x,f.y-s.y)<20){detFrag(f);pop(f.x,f.y-20,'Finisher','#ffb02e',1)}})});
}
function chipUpdate(dt){
 chipT-=dt;if(chipT<=0&&chips.length<4){chipT=5;chips.push({x:80+Math.random()*(W-160),y:80+Math.random()*(H-160),vx:0,vy:0,r:16,t:14})}
 chips.forEach(c=>{c.t-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=Math.pow(.15,dt);c.vy*=Math.pow(.15,dt);
  if(c.x<20||c.x>W-20)c.vx*=-1;if(c.y<20||c.y>H-20)c.vy*=-1;c.x=Math.max(20,Math.min(W-20,c.x));c.y=Math.max(20,Math.min(H-20,c.y));
  wells.forEach(g=>{const d=Math.hypot(g.x-c.x,g.y-c.y);if(d<200&&d>6){c.vx+=(g.x-c.x)/d*700*dt;c.vy+=(g.y-c.y)/d*700*dt}});
  if(beam!==null){const rx=c.x-P.x,ry=c.y-P.y,t=rx*Math.cos(beam)+ry*Math.sin(beam),pp=Math.abs(-rx*Math.sin(beam)+ry*Math.cos(beam));if(t>0&&t<520&&pp<c.r+6)splitChip(c)}});
 chips=chips.filter(c=>!c.dead&&c.t>0);
 frags.forEach(f=>{f.z=(f.z||0)-dt;
  wells.forEach(g=>{const d=Math.hypot(g.x-f.x,g.y-f.y);if(d<190&&d>8){f.x+=(g.x-f.x)/d*150*dt;f.y+=(g.y-f.y)/d*150*dt}});
  if(beam!==null){const rx=f.x-P.x,ry=f.y-P.y,t=rx*Math.cos(beam)+ry*Math.sin(beam),pp=Math.abs(-rx*Math.sin(beam)+ry*Math.cos(beam));if(t>0&&t<520&&pp<18)zapFrag(f)}});
}
function boom(m){
 m.done=1;fx.push({x:m.x,y:m.y,r:4,max:100,t:.4,c:'#ff5d8f',ring:1});spark(m.x,m.y,'#ff5d8f',24,320);shake=7;snd('hammer');
 enemies.forEach(e=>{const d=Math.hypot(e.x-m.x,e.y-m.y)||1;if(d<100)hit(e,4*mult(),(e.x-m.x)/d*350,(e.y-m.y)/d*350)});
 ebul=ebul.filter(b=>Math.hypot(b.x-m.x,b.y-m.y)>100);
 mines.forEach(o=>{if(!o.done&&Math.hypot(o.x-m.x,o.y-m.y)<100)o.go=1});
 chips.forEach(c=>{if(!c.dead&&Math.hypot(c.x-m.x,c.y-m.y)<100)splitChip(c)});
}
function mineUpdate(dt){
 mines.forEach(m=>{m.t-=dt;m.arm-=dt;if(m.t<=0||(m.arm<=0&&enemies.some(e=>Math.hypot(e.x-m.x,e.y-m.y)<e.r+16)))m.go=1});
 for(let i=0;i<6;i++)mines.filter(m=>m.go&&!m.done).forEach(boom);
 mines=mines.filter(m=>!m.done);
}
function discUpdate(dt){
 enemies.forEach(e=>e.dcd=(e.dcd||0)-dt);const spd=Math.hypot(P.vx,P.vy);
 discs.forEach(d=>{d.t-=dt;
  if(d.mode===0){d.a+=dt*(5+od/20);d.x=P.x+Math.cos(d.a)*58;d.y=P.y+Math.sin(d.a)*58}else{d.x+=d.vx*dt;d.y+=d.vy*dt}
  enemies.forEach(e=>{if(e.dcd<=0&&Math.hypot(e.x-d.x,e.y-d.y)<e.r+12){e.dcd=.25;const k=Math.hypot(e.x-d.x,e.y-d.y)||1;hit(e,(2+spd/130)*mult(),(e.x-d.x)/k*220,(e.y-d.y)/k*220)}});
  ebul=ebul.filter(b=>Math.hypot(b.x-d.x,b.y-d.y)>16);
  if(Math.random()<.6)parts.push({x:d.x,y:d.y,vx:0,vy:0,t:.2,c:'#ffd166',s:3})});
 discs=discs.filter(d=>d.t>0&&d.x>-40&&d.x<W+40&&d.y>-40&&d.y<H+40);
}
function bladeUpdate(dt){
 if(slipOn>0){slipOn-=dt;slip.push({x:P.x,y:P.y,t:1.4});enemies.forEach(e=>{if((e.scd||0)<=0&&Math.hypot(e.x-P.x,e.y-P.y)<e.r+22){e.scd=.3;hit(e,3*mult())}})}
 enemies.forEach(e=>e.scd=(e.scd||0)-dt);
 drones.forEach(d=>{if(d.blade&&d.path[d.i])slip.push({x:d.x,y:d.y,t:1.4,d:1})});
 slip.forEach(q=>q.t-=dt);slip=slip.filter(q=>q.t>0);if(slip.length>240)slip.splice(0,slip.length-240);
 if(slip.length)enemies.forEach(e=>{for(let i=0;i<slip.length;i+=2){const q=slip[i];if(Math.hypot(e.x-q.x,e.y-q.y)<e.r+8){e.hp-=7*mult()*dt;break}}});
}
function shieldUpdate(dt){
 const sh=P.shield;if(!sh||sh.t<=0)return;sh.t-=dt;sh.a=Math.atan2(mouse.y-P.y,mouse.x-P.x);
 ebul.forEach(b=>{if(Math.hypot(b.x-P.x,b.y-P.y)<58){let da=Math.abs(Math.atan2(b.y-P.y,b.x-P.x)-sh.a);if(da>Math.PI)da=6.283-da;
  if(da<1.4){b.dead=1;const perfect=sh.t>.25;shots.push({x:b.x,y:b.y,vx:Math.cos(sh.a)*650,vy:Math.sin(sh.a)*650,bounce:0,seen:[],life:1.2,dmg:3,reflect:1,col:'#ffd166'});
   od=Math.min(100,od+(perfect?20:6));spark(b.x,b.y,'#ffd166',12,260);shake=4;snd('perfect');if(perfect){pop(P.x,P.y-30,'Perfect parry','#ffd166',1);flash=Math.max(flash,.15);score+=20}}}});
 ebul=ebul.filter(b=>!b.dead);
}
function weaponsUpdate(dt){
 shieldUpdate(dt);chipUpdate(dt);mineUpdate(dt);discUpdate(dt);bladeUpdate(dt);
 rails.forEach(r=>r.t-=dt);rails=rails.filter(r=>r.t>0);tethers.forEach(h=>h.t-=dt);tethers=tethers.filter(h=>h.t>0);
 enemies.forEach(e=>{if(e.mark>0)e.mark-=dt;if(e.shoot&&!e.boss){e.st-=dt;if(e.st<=0){e.st=2.4+Math.random();ebShot(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x),210)}}});
 drones.forEach(d=>{d.pc=(d.pc||0)-dt;portals.forEach(p=>{if(d.pc<=0&&Math.hypot(p.x-d.x,p.y-d.y)<26){d.pc=.8;enemies.forEach(e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<110)hit(e,3*mult())});fx.push({x:p.x,y:p.y,r:4,max:110,t:.35,c:'#4de1ff',ring:1});pop(p.x,p.y-26,'Echo Frenzy','#4de1ff',1);snd('rift')}})});
}
function drawExtra(t){
 if(loadout.includes('tether'))anchors.forEach(a=>add(()=>{glow(a.x,a.y,36,'#7affd4',.35);ctx.strokeStyle='#7affd4';ctx.fillStyle='#7affd4';ctx.lineWidth=2;ctx.beginPath();ctx.arc(a.x,a.y,10+Math.sin(t*4)*2,0,6.28);ctx.stroke();ctx.beginPath();ctx.arc(a.x,a.y,4,0,6.28);ctx.fill()}));
 chips.forEach(c=>{const bob=Math.sin(t*3+c.x)*3,h=(t*90+c.x)%360;add(()=>glow(c.x,c.y+bob,38,'hsl('+h+',90%,60%)',.5));
  ctx.save();ctx.translate(c.x,c.y+bob);ctx.rotate(Math.sin(t*2+c.y)*.2);ctx.globalAlpha=Math.min(1,c.t/2);
  ctx.fillStyle='rgba(220,235,255,.25)';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(15,12);ctx.lineTo(-15,12);ctx.closePath();ctx.fill();ctx.stroke();
  ['#ff5d8f','#ffb02e','#4de1ff'].forEach((cl,i)=>{ctx.strokeStyle=cl;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4+i*4,-2);ctx.lineTo(24+i*4,-10+i*6);ctx.stroke()});ctx.restore()});
 mines.forEach(m=>{const armed=m.arm<=0,bl=armed?Math.floor(t*6)%2:Math.floor(t*20)%2;add(()=>glow(m.x,m.y,30,'#ff5d8f',armed?.45:.2));
  ctx.save();ctx.translate(m.x,m.y);ctx.rotate(t);ctx.fillStyle='#15112e';ctx.strokeStyle=bl?'#fff':'#ff5d8f';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(11,0);ctx.lineTo(0,11);ctx.lineTo(-11,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()});
 discs.forEach(d=>{add(()=>glow(d.x,d.y,34,'#ffd166',.5));ctx.save();ctx.translate(d.x,d.y);ctx.rotate(t*14);ctx.fillStyle='#ffd166';ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?7:15,a=i*.785;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.fillStyle='#15112e';ctx.beginPath();ctx.arc(0,0,4,0,6.28);ctx.fill();ctx.restore()});
 if(slip.length>1)add(()=>{ctx.lineCap='round';for(let i=1;i<slip.length;i++){const a=slip[i-1],b=slip[i];if(!!a.d!==!!b.d)continue;const f=Math.min(1,b.t);ctx.globalAlpha=f*.8;ctx.strokeStyle=i%2?'#7affd4':'#4de1ff';ctx.lineWidth=2+f*10;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}});

 $('#pBody').innerHTML=p.map(q=>`<div class="card w" data-p="${PERKS.indexOf(q)}"><b>${q[0]}</b><p>${q[1]}</p></div>`).join('');pov.classList.add('on')}
$('#pBody').onclick=e=>{const c=e.target.closest('[data-p]');if(!c)return;PERKS[c.dataset.p][2]();pov.classList.remove('on');running=true;last=performance.now();requestAnimationFrame(loop)};

/* ---- weapon search ---- */
const sb=document.createElement('input');sb.id='wsearch';sb.type='search';$('#arsenal').before(sb);
function filt(){const q=sb.value.trim().toLowerCase();$$('#arsenal [data-w]').forEach(c=>{const w=byId(c.dataset.w);c.style.display=!q||(w.name+' '+w.id+' '+w.type+' '+w.desc+' '+w.tut).toLowerCase().includes(q)?'':'none'})}
sb.oninput=filt;
const odl=drawLoad;drawLoad=function(){odl();sb.placeholder='Search '+WEAPONS.length+' weapons...';filt()};
addEventListener('keydown',e=>{if(e.target===sb||e.target.id==='lbName')e.stopPropagation()},true);

/* ---- leaderboard ---- */
let LB=[],NAME='PILOT';try{LB=JSON.parse(localStorage.getItem('od_lb')||'[]');NAME=localStorage.getItem('od_name')||'PILOT'}catch(e){}
const lsec=document.createElement('section');lsec.id='lb';lsec.className='screen';
lsec.innerHTML='<button class="back" id="lBack">Back</button><h2>Leaderboard</h2><p class="tag" style="margin-bottom:8px">Your top 10 runs on this device. Lessons do not count. A star means mutators were on.</p><input id="lbName" maxlength="12" placeholder="Pilot name"><div id="lbBody" style="margin-top:12px"></div><div class="row"><button id="lbClr">Clear</button></div>';
document.body.insertBefore(lsec,document.querySelector('script'));
function drawLB(){$('#lbName').value=NAME;$('#lbBody').innerHTML=LB.length?LB.map((r,i)=>`<div class="card" style="border-left-color:${i<3?'#ffb02e':'#4de1ff'}"><b>${i+1}. ${r.n.replace(/</g,'&lt;')}${r.m?' <span class="star">&#9733;</span>':''}  -  ${r.s}</b><p>Wave ${r.w} | ${r.k} kills</p></div>`).join(''):'<p class="tag">No runs yet. Play Endless Mode to set a score.</p>'}
$('#lbName').oninput=e=>{NAME=e.target.value.trim()||'PILOT';try{localStorage.setItem('od_name',NAME)}catch(x){}};
$('#lbClr').onclick=()=>{LB=[];try{localStorage.setItem('od_lb','[]')}catch(x){}drawLB()};
$('#lBack').onclick=()=>{sum();show('home')};
const lbB=document.createElement('button');lbB.innerHTML='Leaderboard<small>Top runs on this device</small>';menu.insertBefore(lbB,$('#bTut'));
lbB.onclick=()=>{drawLB();show('lb')};
const ohud5=hud;hud=function(){ohud5();
 if(gameOver&&!lbSaved){lbSaved=1;if(!lesson){const en={n:NAME,s:score,w:wave,k:stats.kills,m:MUTS.some(m=>mut[m[0]])?1:0};LB.push(en);LB.sort((a,b)=>b.s-a.s);LB=LB.slice(0,10);try{localStorage.setItem('od_lb',JSON.stringify(LB))}catch(x){}
  const r=LB.indexOf(en)+1;if(r)$('#overS').textContent+='  |  Leaderboard #'+r}}};

/* ============ ADDON 6: Pure Mode (no upgrades), leaderboards (local + global), Versus Online ============
   Paste AFTER addon5, at the very end of your main script block.
   Pure Mode and the local leaderboard work anywhere. Global leaderboard and Versus light up only when this page is
   published as a claude.ai artifact with the `room`, `db` and `user` capabilities (they stay hidden/disabled otherwise). */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pureRun=0,lbMode=0,lbScope='local',lbSaved6=0,vs={room:null,on:0,last:0,t0:0,won:0,chk:0},NET={db:null,uid:null,room:null,tried:0};
CONTROLS.push(['Pure Mode','Home screen: a run with no upgrades between waves. It has its own leaderboard.'],['Versus Online','Join a room code with friends. You see their ships live, and every 10-chain sends enemies to them. Last one standing wins.']);

/* ---- online plumbing (fails quietly when unavailable) ---- */
async function netInit(){if(NET.tried)return;NET.tried=1;
 try{if(!window.claude||!claude.use)return;NET.db=await claude.use('db');const u=await claude.use('user');NET.uid=u&&u.id?await u.id():null;NET.room=await claude.use('room')}catch(e){}}
netInit();
async function gSubmit(en){if(!NET.db||!NET.uid)return;try{const ref=NET.db.doc((en.p?'scores_pure/':'scores_std/')+NET.uid),s=await ref.get();if(!s.exists||(+s.data().s||0)<en.s)await ref.set({n:en.n,s:en.s,w:en.w,k:en.k})}catch(e){}}
async function gLoad(p){await netInit();if(!NET.db)return null;try{const q=await NET.db.collection(p?'scores_pure':'scores_std').orderBy('s','desc').limit(10).get();return q.docs.map(d=>d.data())}catch(e){return null}}

/* ---- Pure Mode ---- */
const oop6=openPerks;openPerks=function(){if(pureRun)return;oop6()};
const osg6=startGame;startGame=function(){osg6();lbSaved6=0;vs.won=0;vs.t0=performance.now();pureRun=pureRun&&!lesson?1:0};
const odb6=db.onclick;db.onclick=()=>{pureRun=0;vs.on=0;odb6()};
$('#bPlay').onclick=$('#bPlay2').onclick=()=>{pureRun=0;vs.on=0;lesson=null;startGame()};
const pb=document.createElement('button');pb.innerHTML='Pure Mode<small>No upgrades. Pure weapon skill</small>';
pb.onclick=()=>{pureRun=1;vs.on=0;lesson=null;startGame();banner={t:3,txt:'PURE MODE'}};
menu.insertBefore(pb,$('#bLoad'));

/* ---- leaderboard: modes + scopes ---- */
const ctl=document.createElement('div');ctl.id='lbCtl';ctl.className='tabs';$('#lbBody').before(ctl);
ctl.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k==='m0')lbMode=0;if(k==='m1')lbMode=1;if(k==='sl')lbScope='local';if(k==='sg')lbScope='global';drawLB()};
drawLB=async function(){$('#lbName').value=NAME;
 ctl.innerHTML=[['m0','Standard',!lbMode],['m1','Pure',lbMode],['sl','This device',lbScope==='local'],['sg','Global',lbScope==='global']].map(b=>`<button data-k="${b[0]}" class="${b[2]?'act':''}">${b[1]}</button>`).join('');
 let rows;
 if(lbScope==='local')rows=LB.filter(r=>!!r.p===!!lbMode).sort((a,b)=>b.s-a.s);
 else{$('#lbBody').innerHTML='<p class="tag">Loading...</p>';rows=await gLoad(lbMode);if(!rows){$('#lbBody').innerHTML='<p class="tag">The global board needs the published online version of this game.</p>';return}}
 $('#lbBody').innerHTML=rows.length?rows.map((r,i)=>`<div class="card" style="border-left-color:${i<3?'#ffb02e':'#4de1ff'}"><b>${i+1}. ${esc(r.n||'?')}${r.m?' <span class="star">&#9733;</span>':''}  -  ${+r.s||0}</b><p>Wave ${+r.w||0} | ${+r.k||0} kills</p></div>`).join(''):'<p class="tag">No runs here yet.</p>'};
function saveRun(){if(lesson)return;
 const en={n:NAME,s:score,w:wave,k:stats.kills,m:MUTS.some(m=>mut[m[0]])?1:0,p:pureRun?1:0};
 LB.push(en);LB=[0,1].flatMap(p=>LB.filter(r=>!!r.p===!!p).sort((a,b)=>b.s-a.s).slice(0,10));
 try{localStorage.setItem('od_lb',JSON.stringify(LB))}catch(e){}
 const r=LB.filter(x=>!!x.p===!!en.p).sort((a,b)=>b.s-a.s).indexOf(en)+1;if(r)$('#overS').textContent+='  |  '+(en.p?'Pure ':'')+'Leaderboard #'+r;
 if(!en.m)gSubmit(en)}

/* ---- Versus Online ---- */
const vsec=document.createElement('section');vsec.id='vs';vsec.className='screen';
vsec.innerHTML='<button class="back" id="vBack">Back</button><h2>Versus Online</h2><p class="tag" style="margin-bottom:8px">Pick a room code, share it, and everyone joins it. Then everyone presses Play. Every 10-chain sends enemies to the others. Last one alive wins. Set your pilot name on the Leaderboard screen.</p><input id="vCode" maxlength="10" placeholder="Room code (letters and numbers)" style="width:100%;max-width:420px;padding:12px 14px;font:inherit;font-size:16px;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:4px"><div class="row" style="margin-top:10px"><button id="vJoin">Join room</button><button id="vPlay" class="main">Play</button></div><p class="tag" id="vStat" style="margin-top:12px"></p><div id="vList"></div>';
document.body.insertBefore(vsec,document.querySelector('script'));
addEventListener('keydown',e=>{if(e.target.id==='vCode')e.stopPropagation()},true);
function drawVs(){const ps=vs.room?vs.room.peers():[];$('#vList').innerHTML=ps.length?ps.map(p=>{const q=p.presence||{};return `<div class="card"><b>${esc(String(q.n||'Pilot').slice(0,12))}${p.isMe?' (you)':''}</b><p>${q.v?'In a run, score '+(+q.s||0)+', wave '+(+q.w||0):'In the lobby'}</p></div>`}).join(''):''}
$('#vJoin').onclick=async()=>{const code=($('#vCode').value||'lobby').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10)||'lobby',st=$('#vStat');st.textContent='Connecting...';await netInit();
 if(!NET.room){st.textContent='Online play needs the published version of this game (with live rooms). Offline you can still use Endless, Pure Mode and the local leaderboard.';return}
 try{if(vs.room)await vs.room.leave();const r=await NET.room.join('od-'+code);vs.room=r;
  r.onPeers(()=>drawVs());
  r.on('send',m=>{if(m.isMe||!vs.on||!running)return;const n=Math.max(1,Math.min(8,((m.data&&+m.data.n)|0)||2));
   for(let i=0;i<n;i++){const a=Math.random()*6.283;spawnQ.push({x:W/2+Math.cos(a)*620,y:H/2+Math.sin(a)*620,vx:0,vy:0,hp:2+(wave/2|0),r:13,sp:95+wave*5,st:99,noSplit:1})}
   banner={t:2,txt:'INCOMING x'+n};snd('warn')});
  await r.presence({n:NAME,v:0});st.textContent='In room "'+code+'". Share the code, then everyone presses Play.';drawVs()}catch(e){st.textContent='Could not join the room.'}};
$('#vPlay').onclick=()=>{if(!vs.room){$('#vStat').textContent='Join a room first.';return}pureRun=0;lesson=null;vs.on=1;startGame();banner={t:3,txt:'VERSUS'}};
$('#vBack').onclick=()=>{sum();show('home')};
const vb=document.createElement('button');vb.innerHTML='Versus Online<small>Race friends in a live room</small>';menu.insertBefore(vb,$('#bLoad'));
vb.onclick=()=>{drawVs();show('vs')};
const osh6=show;show=function(id){osh6(id);if(id!=='game'){if(vs.room&&vs.on)vs.room.presence({v:0}).catch(()=>{});vs.on=0}};
function vsPres(){if(!vs.on||!vs.room)return;const al=gameOver?0:1;vs.room.presence({n:NAME,v:1,al,x:Math.round(P.x),y:Math.round(P.y),a:+Math.atan2(mouse.y-P.y,mouse.x-P.x).toFixed(2),s:score,w:wave,h:Math.max(0,Math.round(P.hp))}).catch(()=>{})}
const ok6=onKill;onKill=function(e){ok6(e);if(vs.on&&vs.room&&(combo%10===0||e.boss)){vs.room.emit('send',{n:e.boss?6:Math.min(6,2+(combo/10|0))}).catch(()=>{});pop(P.x,P.y-60,'Sent!','#ff5d8f',1)}};
const owu6=weaponsUpdate;weaponsUpdate=function(dt){owu6(dt);
 if(vs.on&&vs.room){const now=performance.now();
  if(now-vs.last>100){vs.last=now;vsPres()}
  if(now-vs.chk>1000){vs.chk=now;const o=vs.room.peers().filter(p=>!p.isMe&&p.presence&&p.presence.v);
   if(!vs.won&&now-vs.t0>8000&&o.length&&o.every(p=>!p.presence.al)){vs.won=1;score+=500;pop(W/2,H/2-30,'LAST ONE STANDING','#ffb02e',1);banner={t:3.5,txt:'YOU WIN'};snd('rank');flash=.4}}}
};
const ode6=drawExtra;drawExtra=function(t){ode6(t);
 if(vs.on&&vs.room)vs.room.peers().forEach(p=>{const q=p.presence;if(p.isMe||!q||!q.v)return;const x=+q.x||0,y=+q.y||0,al=q.al;
  add(()=>glow(x,y,34,al?'#ff5d8f':'#a79fd6',.3));
  ctx.save();ctx.globalAlpha=al?.8:.3;ctx.translate(x,y);ctx.rotate(+q.a||0);ctx.strokeStyle=al?'#ff5d8f':'#a79fd6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-12,-14);ctx.lineTo(-7,0);ctx.lineTo(-12,14);ctx.closePath();ctx.stroke();ctx.restore();
  ctx.save();ctx.globalAlpha=al?.9:.4;ctx.fillStyle='#f1edff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(String(q.n||'Pilot').slice(0,12),x,y-24);ctx.restore()})};
const ohud6=hud;hud=function(){
 if(gameOver&&!lbSaved6){lbSaved6=1;lbSaved=1;var fresh=1}
 ohud6();
 if(fresh){saveRun();vsPres()}
 ctx.save();ctx.textAlign='left';
 if(pureRun){ctx.fillStyle='#7affd4';ctx.font='bold 13px sans-serif';ctx.fillText('PURE MODE: no upgrades',16,100)}
 if(vs.on&&vs.room){const rows=vs.room.peers().filter(p=>p.presence&&p.presence.v).map(p=>({n:p.isMe?'You':String(p.presence.n||'Pilot').slice(0,10),s:p.isMe?score:(+p.presence.s||0),al:p.isMe?!gameOver:!!p.presence.al})).sort((a,b)=>b.s-a.s).slice(0,6);
  ctx.font='bold 13px sans-serif';rows.forEach((r,i)=>{ctx.fillStyle=r.al?(r.n==='You'?'#ffb02e':'#f1edff'):'#6f68a0';ctx.fillText((i+1)+'. '+r.n+'  '+r.s+(r.al?'':'  (out)'),16,122+i*18)})}
 ctx.restore()};

</script>
